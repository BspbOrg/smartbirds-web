<sb-leaflet-collection-map center="map.center" zoom="map.zoom" max-zoom="15"
                           markers="map.markers"
                           on-click="map.onMarkerClick"
                           polygons="map.polygons" on-polygon-click="map.onPolygonClick"
                           polygon-style-fn="map.zoneStyle" selected-polygons="selectedZone"
                           polygon-min-zoom="map.polygonMinZoom"></sb-leaflet-collection-map>
