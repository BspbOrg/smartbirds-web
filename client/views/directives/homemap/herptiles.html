<sb-leaflet-collection-map
  center="map.center"
  zoom="map.zoom"
  fit="true"
  max-zoom="map.options.maxZoom"
  markers="map.records"
  cluster="true"
>
  <marker-popup>
    <h5 class="text-uppercase text-justify"><small translate>PUBLIC_HERPTILES_MAP_SPECIES</small> {{$model.species_count}}</h5>
    <h5 class="text-uppercase text-justify"><small translate>PUBLIC_HERPTILES_MAP_INDIVIDUALS</small> {{$model.units_count}}</h5>
  </marker-popup>
</sb-leaflet-collection-map>

<ng-include src="'/views/directives/homemap/helptext.html'"></ng-include>
